<svg width="960" height="88" viewBox="0 0 960 88" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Card Gradients -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#112240"/>
      <stop offset="50%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#040914"/>
    </linearGradient>

    <!-- Top Laser Highlight Gradient -->
    <linearGradient id="laserGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0"/>
      <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="75%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Icon Glow -->
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#38BDF8" flood-opacity="0.5"/>
    </filter>

    <!-- Subtle Drop Shadow -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <style>

    .card-shell {
      fill: url(#cardBg);
      stroke: rgba(56, 189, 248, 0.45);
      stroke-width: 1.2;
      rx: 10px;
    }
    .card-top-laser {
      stroke: url(#laserGlow);
      stroke-width: 1.8;
      stroke-linecap: round;
    }
    .icon-chassis {
      fill: rgba(8, 20, 44, 0.95);
      stroke: rgba(56, 189, 248, 0.6);
      stroke-width: 1.4;
      rx: 8px;
    }
    .tag-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 0.12em;
      fill: #38BDF8;
      text-transform: uppercase;
    }
    .title-text {
      font-family: 'Space Grotesk', -apple-system, sans-serif;
      font-size: 13.5px;
      font-weight: 800;
      letter-spacing: -0.01em;
      fill: #FFFFFF;
    }
    .desc-text {
      font-family: 'Space Grotesk', -apple-system, sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.01em;
      fill: #94A3B8;
    }
  </style>

  <!-- ==================== CARD 1: AUTONOMOUS MULTI-AGENT ==================== -->
  <g transform="translate(0, 4)" filter="url(#cardShadow)">
    <rect class="card-shell" x="0" y="0" width="232" height="78"/>
    <line class="card-top-laser" x1="16" y1="1" x2="216" y2="1"/>

    <!-- Icon Box -->
    <g transform="translate(14, 17)" filter="url(#iconGlow)">
      <rect class="icon-chassis" x="0" y="0" width="44" height="44"/>
      <!-- Agent Network Glyph -->
      <g stroke="#38BDF8" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="22" cy="14" r="3.5" fill="#38BDF8"/>
        <circle cx="13" cy="29" r="3.5" fill="#0284C7"/>
        <circle cx="31" cy="29" r="3.5" fill="#0284C7"/>
        <path d="M19.5 16.5L14.5 26M24.5 16.5L29.5 26M16.5 29h11" stroke="#BAE6FD" stroke-width="1.2"/>
        <circle cx="22" cy="22" r="1.5" fill="#FFFFFF"/>
      </g>
    </g>

    <!-- Content -->
    <text class="tag-text" x="68" y="27">01 // AGENT ORCHESTRATION</text>
    <text class="title-text" x="68" y="47">Autonomous Agents</text>
    <text class="desc-text" x="68" y="64">Stateful &bull; Circuit Breakers</text>
  </g>

  <!-- ==================== CARD 2: SELF-IMPROVING AI ==================== -->
  <g transform="translate(242, 4)" filter="url(#cardShadow)">
    <rect class="card-shell" x="0" y="0" width="232" height="78"/>
    <line class="card-top-laser" x1="16" y1="1" x2="216" y2="1"/>

    <!-- Icon Box -->
    <g transform="translate(14, 17)" filter="url(#iconGlow)">
      <rect class="icon-chassis" x="0" y="0" width="44" height="44"/>
      <!-- Compiler Loop Glyph -->
      <g stroke="#38BDF8" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M29 16A9 9 0 1 0 31 22M31 16v5h-5"/>
        <circle cx="22" cy="22" r="3" fill="#38BDF8"/>
        <path d="M18 22l3-3 3 3" stroke="#FFFFFF" stroke-width="1.2"/>
      </g>
    </g>

    <!-- Content -->
    <text class="tag-text" x="68" y="27">02 // AI COMPILERS (DSPy)</text>
    <text class="title-text" x="68" y="47">Self-Improving Loops</text>
    <text class="desc-text" x="68" y="64">MIPROv2 &bull; Auto-Refinement</text>
  </g>

  <!-- ==================== CARD 3: GEO & AEO SEARCH ==================== -->
  <g transform="translate(484, 4)" filter="url(#cardShadow)">
    <rect class="card-shell" x="0" y="0" width="232" height="78"/>
    <line class="card-top-laser" x1="16" y1="1" x2="216" y2="1"/>

    <!-- Icon Box -->
    <g transform="translate(14, 17)" filter="url(#iconGlow)">
      <rect class="icon-chassis" x="0" y="0" width="44" height="44"/>
      <!-- Search Radar & Citations Glyph -->
      <g stroke="#38BDF8" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="20" cy="20" r="9"/>
        <path d="M20 11a9 9 0 0 1 0 18M11 20h18"/>
        <path d="M26.5 26.5L32 32" stroke="#BAE6FD" stroke-width="2.2"/>
        <circle cx="20" cy="20" r="2" fill="#FFFFFF"/>
      </g>
    </g>

    <!-- Content -->
    <text class="tag-text" x="68" y="27">03 // AI SEARCH &amp; CITATIONS</text>
    <text class="title-text" x="68" y="47">GEO &amp; AEO Engine</text>
    <text class="desc-text" x="68" y="64">ChatGPT &bull; Gemini &bull; Claude</text>
  </g>

  <!-- ==================== CARD 4: DISTRIBUTED CRAWLERS ==================== -->
  <g transform="translate(726, 4)" filter="url(#cardShadow)">
    <rect class="card-shell" x="0" y="0" width="232" height="78"/>
    <line class="card-top-laser" x1="16" y1="1" x2="216" y2="1"/>

    <!-- Icon Box -->
    <g transform="translate(14, 17)" filter="url(#iconGlow)">
      <rect class="icon-chassis" x="0" y="0" width="44" height="44"/>
      <!-- Distributed Cluster & Anti-Bot Shield Glyph -->
      <g stroke="#38BDF8" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="13" y="13" width="7" height="7" rx="1.5" fill="#38BDF8"/>
        <rect x="24" y="13" width="7" height="7" rx="1.5" fill="#0284C7"/>
        <rect x="18" y="24" width="7" height="7" rx="1.5" fill="#0284C7"/>
        <path d="M16.5 20v2h5v2M27.5 20v2h-5" stroke="#BAE6FD" stroke-width="1.2"/>
        <circle cx="22" cy="12" r="1.2" fill="#FFFFFF"/>
      </g>
    </g>

    <!-- Content -->
    <text class="tag-text" x="68" y="27">04 // DISTRIBUTED ENGINES</text>
    <text class="title-text" x="68" y="47">High-Scale Crawlers</text>
    <text class="desc-text" x="68" y="64">Go &bull; Anti-Bot &bull; Scale</text>
  </g>
</svg>
