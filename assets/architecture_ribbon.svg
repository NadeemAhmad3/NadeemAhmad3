<svg width="960" height="66" viewBox="0 0 960 66" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1A34" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#060E20" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Space Grotesk', Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 700;
      fill: #FFFFFF;
      letter-spacing: 0.02em;
    }
    .pill-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Space Grotesk', Helvetica, Arial, sans-serif;
      font-size: 10px;
      font-weight: 800;
      fill: #38BDF8;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .pill-rect {
      fill: url(#cardBg);
      stroke: rgba(56, 189, 248, 0.45);
      stroke-width: 1.2;
      rx: 8px;
    }
    .icon-box {
      fill: rgba(2, 132, 199, 0.2);
      stroke: rgba(56, 189, 248, 0.5);
      stroke-width: 1;
      rx: 6px;
    }
  </style>

  <!-- PILL 1: Autonomous Agents -->
  <g transform="translate(0, 3)">
    <rect class="pill-rect" x="0" y="0" width="232" height="60"/>
    <line x1="12" y1="1" x2="220" y2="1" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1"/>
    
    <!-- Icon Container -->
    <rect class="icon-box" x="12" y="14" width="32" height="32"/>
    <!-- Agent Icon -->
    <g transform="translate(18, 20)" stroke="#38BDF8" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="3" width="16" height="14" rx="3"/>
      <circle cx="6.5" cy="10" r="1.5" fill="#38BDF8"/>
      <circle cx="13.5" cy="10" r="1.5" fill="#38BDF8"/>
      <line x1="10" y1="1" x2="10" y2="3"/>
      <path d="M7 14h6"/>
    </g>

    <!-- Texts -->
    <text class="pill-sub" x="52" y="27">AUTONOMOUS SYSTEMS</text>
    <text class="pill-text" x="52" y="44">Multi-Agent Control</text>
  </g>

  <!-- PILL 2: Self-Improving AI -->
  <g transform="translate(242, 3)">
    <rect class="pill-rect" x="0" y="0" width="232" height="60"/>
    <line x1="12" y1="1" x2="220" y2="1" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1"/>
    
    <!-- Icon Container -->
    <rect class="icon-box" x="12" y="14" width="32" height="32"/>
    <!-- Loop / Optimization Icon -->
    <g transform="translate(18, 20)" stroke="#38BDF8" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 10A7 7 0 1 1 14 4.5L18 4"/>
      <path d="M18 1v4h-4"/>
      <circle cx="10" cy="10" r="2.5" fill="#38BDF8"/>
    </g>

    <!-- Texts -->
    <text class="pill-sub" x="52" y="27">OPTIMIZATION (DSPy)</text>
    <text class="pill-text" x="52" y="44">Self-Improving AI</text>
  </g>

  <!-- PILL 3: GEO & AEO -->
  <g transform="translate(484, 3)">
    <rect class="pill-rect" x="0" y="0" width="232" height="60"/>
    <line x1="12" y1="1" x2="220" y2="1" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1"/>
    
    <!-- Icon Container -->
    <rect class="icon-box" x="12" y="14" width="32" height="32"/>
    <!-- Search / Citations Globe Icon -->
    <g transform="translate(18, 20)" stroke="#38BDF8" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="10" cy="10" r="8"/>
      <path d="M2 10h16"/>
      <path d="M10 2a12 12 0 0 1 0 16 12 12 0 0 1 0-16"/>
    </g>

    <!-- Texts -->
    <text class="pill-sub" x="52" y="27">AI SEARCH &amp; CITATIONS</text>
    <text class="pill-text" x="52" y="44">AEO &amp; GEO Intelligence</text>
  </g>

  <!-- PILL 4: Distributed Crawlers -->
  <g transform="translate(726, 3)">
    <rect class="pill-rect" x="0" y="0" width="232" height="60"/>
    <line x1="12" y1="1" x2="220" y2="1" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1"/>
    
    <!-- Icon Container -->
    <rect class="icon-box" x="12" y="14" width="32" height="32"/>
    <!-- Distributed Cluster / Scale Icon -->
    <g transform="translate(18, 20)" stroke="#38BDF8" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="2" width="6" height="6" rx="1"/>
      <rect x="12" y="2" width="6" height="6" rx="1"/>
      <rect x="7" y="12" width="6" height="6" rx="1"/>
      <path d="M5 8v2h5v2M15 8v2h-5"/>
    </g>

    <!-- Texts -->
    <text class="pill-sub" x="52" y="27">DISTRIBUTED ENGINES</text>
    <text class="pill-text" x="52" y="44">Crawlers &amp; Anti-Bot (Go)</text>
  </g>
</svg>
